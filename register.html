<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="logo.png">
<title>注册 · 创智算</title>
<style>
  :root{
    --ink:#1B241C; --forest:#3F5541; --forest-deep:#2C3B2E;
    --paper:#F2F1E7; --copper:#B9863B; --signal:#6EE7A8;
    --line:rgba(27,36,28,0.14);
    --mono: ui-monospace, 'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--paper); color:var(--ink); font-family:var(--sans); padding:24px;
    background-image:
      linear-gradient(rgba(63,85,65,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(63,85,65,0.05) 1px, transparent 1px);
    background-size:44px 44px;
  }
  .card{
    width:100%; max-width:420px; background:#fff; border:1px solid var(--line);
    border-radius:18px; padding:34px; box-shadow:0 18px 50px rgba(44,59,46,0.12);
  }
  .brand{display:flex; align-items:center; gap:12px; margin-bottom:24px;}
  .brand-mark{
    width:42px; height:42px; border-radius:50%; background:var(--forest-deep);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .brand-mark svg{width:26px; height:26px;}
  .brand-name{font-weight:700; font-size:16px;}
  .brand-sub{font-family:var(--mono); font-size:10px; color:var(--forest); letter-spacing:0.08em;}
  h1{font-size:22px; font-weight:800; margin-bottom:6px;}
  .sub{font-size:13px; color:rgba(27,36,28,0.55); margin-bottom:18px;}
  label{display:block; font-size:12.5px; font-weight:700; margin-bottom:6px; margin-top:13px;}
  label .opt{font-weight:400; color:rgba(27,36,28,0.45); font-size:11px; margin-left:4px;}
  input{
    width:100%; border:1px solid var(--line); border-radius:10px; padding:12px 14px;
    font-family:var(--sans); font-size:14px; background:var(--paper); color:var(--ink);
  }
  input:focus{outline:2px solid var(--forest); outline-offset:1px;}
  .btn{
    width:100%; margin-top:20px; padding:13px; border-radius:100px; border:none;
    background:var(--forest-deep); color:var(--paper); font-size:15px; font-weight:700;
    cursor:pointer; transition:transform .15s;
  }
  .btn:hover{transform:translateY(-1px);}
  .btn:disabled{opacity:0.6; cursor:wait;}
  .msg{
    display:none; margin-top:14px; padding:10px 14px; border-radius:10px;
    font-size:12.5px; line-height:1.6;
  }
  .msg.err{display:block; background:rgba(185,90,60,0.1); color:#9c4a2f; border:1px solid rgba(185,90,60,0.3);}
  .msg.ok{display:block; background:rgba(110,231,168,0.16); color:var(--forest-deep); border:1px solid rgba(63,85,65,0.3);}
  .foot{margin-top:18px; font-size:12.5px; color:rgba(27,36,28,0.55);}
  .foot a{color:var(--forest); font-weight:600; text-decoration:underline; text-underline-offset:3px;}
  .note{font-size:11px; color:rgba(27,36,28,0.4); margin-top:14px; text-align:center; font-family:var(--mono);}
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="brand-mark"><img src="logo.png" alt="创智算" style="width:100%; height:100%; border-radius:50%; display:block;"></div>
    <div>
      <div class="brand-name">"创智算"数字科技协会</div>
      <div class="brand-sub">CHUANGZHISUAN.CLUB</div>
    </div>
  </div>

  <h1>注册账号</h1>
  <p class="sub">注册后可查看竞赛信息与全部学习资源。</p>

  <label for="username">用户名 <span class="opt">2–20 位字母/数字/下划线/中文</span></label>
  <input type="text" id="username" placeholder="登录用户名" autocomplete="username">

  <label for="password">密码 <span class="opt">6–64 位</span></label>
  <input type="password" id="password" placeholder="设置密码" autocomplete="new-password">

  <label for="confirm">确认密码</label>
  <input type="password" id="confirm" placeholder="再次输入密码" autocomplete="new-password">

  <label for="name">姓名 <span class="opt">选填</span></label>
  <input type="text" id="name" placeholder="真实姓名">

  <label for="studentId">学号 <span class="opt">选填</span></label>
  <input type="text" id="studentId" placeholder="学号">

  <label for="college">学院 <span class="opt">选填</span></label>
  <input type="text" id="college" placeholder="所在学院">

  <button class="btn" id="regBtn">注 册</button>
  <div class="msg" id="msg"></div>

  <div class="foot">已有账号？<a href="login.html">返回登录 →</a></div>
  <div class="note">USER DATABASE · SQLITE</div>
</div>

<script>
  const msg = document.getElementById('msg');
  const btn = document.getElementById('regBtn');

  function showMsg(text, ok){
    msg.textContent = text;
    msg.className = 'msg ' + (ok ? 'ok' : 'err');
  }

  async function doRegister(){
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;
    const name = document.getElementById('name').value.trim();
    const studentId = document.getElementById('studentId').value.trim();
    const college = document.getElementById('college').value.trim();

    if(!username || !password) return showMsg('请填写用户名和密码', false);
    if(password !== confirm) return showMsg('两次输入的密码不一致', false);

    btn.disabled = true;
    try{
      const r = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password, name, studentId, college }),
      });
      const d = await r.json();
      if(r.ok){
        showMsg('注册成功！正在跳转到登录页…', true);
        setTimeout(() => location.href = '/login.html', 700);
      } else {
        showMsg(d.msg || '注册失败', false);
      }
    }catch(e){
      showMsg('网络错误，请重试', false);
    }
    btn.disabled = false;
  }

  document.getElementById('regBtn').addEventListener('click', doRegister);
</script>
</body>
</html>
