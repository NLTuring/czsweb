<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="logo.png">
<title>登录 · 创智算</title>
<style>
  :root{
    --ink:#1B241C; --forest:#3F5541; --forest-deep:#2C3B2E;
    --paper:#F2F1E7; --copper:#B9863B; --signal:#6EE7A8;
    --line:rgba(27,36,28,0.14);
    --mono: ui-monospace, 'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--paper); color:var(--ink); font-family:var(--sans); padding:24px;
    background-image:
      linear-gradient(rgba(63,85,65,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(63,85,65,0.05) 1px, transparent 1px);
    background-size:44px 44px;
  }
  .card{
    width:100%; max-width:400px; background:#fff; border:1px solid var(--line);
    border-radius:18px; padding:36px 34px; box-shadow:0 18px 50px rgba(44,59,46,0.12);
  }
  .brand{display:flex; align-items:center; gap:12px; margin-bottom:26px;}
  .brand-mark{
    width:42px; height:42px; border-radius:50%; background:var(--forest-deep);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .brand-mark svg{width:26px; height:26px;}
  .brand-name{font-weight:700; font-size:16px;}
  .brand-sub{font-family:var(--mono); font-size:10px; color:var(--forest); letter-spacing:0.08em;}
  h1{font-size:22px; font-weight:800; margin-bottom:6px;}
  .sub{font-size:13px; color:rgba(27,36,28,0.55); margin-bottom:24px;}
  label{display:block; font-size:12.5px; font-weight:700; margin-bottom:6px; margin-top:14px;}
  input{
    width:100%; border:1px solid var(--line); border-radius:10px; padding:12px 14px;
    font-family:var(--sans); font-size:14px; background:var(--paper); color:var(--ink);
  }
  input:focus{outline:2px solid var(--forest); outline-offset:1px;}
  .btn{
    width:100%; margin-top:22px; padding:13px; border-radius:100px; border:none;
    background:var(--forest-deep); color:var(--paper); font-size:15px; font-weight:700;
    cursor:pointer; transition:transform .15s;
  }
  .btn:hover{transform:translateY(-1px);}
  .btn:disabled{opacity:0.6; cursor:wait;}
  .msg{
    display:none; margin-top:14px; padding:10px 14px; border-radius:10px;
    font-size:12.5px; line-height:1.6;
  }
  .msg.err{display:block; background:rgba(185,90,60,0.1); color:#9c4a2f; border:1px solid rgba(185,90,60,0.3);}
  .msg.ok{display:block; background:rgba(110,231,168,0.16); color:var(--forest-deep); border:1px solid rgba(63,85,65,0.3);}
  .foot{display:flex; justify-content:space-between; margin-top:18px; font-size:12.5px; color:rgba(27,36,28,0.55);}
  .foot a{color:var(--forest); font-weight:600; text-decoration:underline; text-underline-offset:3px;}
  .note{font-size:11px; color:rgba(27,36,28,0.4); margin-top:16px; text-align:center; font-family:var(--mono);}
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="brand-mark"><img src="logo.png" alt="创智算" style="width:100%; height:100%; border-radius:50%; display:block;"></div>
    <div>
      <div class="brand-name">"创智算"数字科技协会</div>
      <div class="brand-sub">CHUANGZHISUAN.CLUB</div>
    </div>
  </div>

  <h1>登录</h1>
  <p class="sub">登录后才能查看竞赛信息与学习资源。</p>

  <label for="username">用户名</label>
  <input type="text" id="username" placeholder="用户名 / 学号" autocomplete="username">

  <label for="password">密码</label>
  <input type="password" id="password" placeholder="密码" autocomplete="current-password">

  <button class="btn" id="loginBtn">登 录</button>
  <div class="msg" id="msg"></div>

  <div class="foot">
    <span>还没有账号？</span>
    <a href="register.html">注册新账号 →</a>
  </div>
  <div class="note">ACCESS CONTROL · SESSION 7D</div>
</div>

<script>
  const msg = document.getElementById('msg');
  const btn = document.getElementById('loginBtn');

  function showMsg(text, ok){
    msg.textContent = text;
    msg.className = 'msg ' + (ok ? 'ok' : 'err');
  }

  async function doLogin(){
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    if(!username || !password) return showMsg('请输入用户名和密码', false);

    btn.disabled = true;
    try{
      const r = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const d = await r.json();
      if(r.ok){
        showMsg('登录成功，正在跳转…', true);
        const next = new URLSearchParams(location.search).get('next');
        setTimeout(() => location.href = next ? decodeURIComponent(next) : '/index.html', 400);
      } else {
        showMsg(d.msg || '登录失败', false);
      }
    }catch(e){
      showMsg('网络错误，请重试', false);
    }
    btn.disabled = false;
  }

  document.getElementById('loginBtn').addEventListener('click', doLogin);
  document.getElementById('password').addEventListener('keydown', e => { if(e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
